name: FederatedAppCredentials
uid: botframework-connector.FederatedAppCredentials
package: botframework-connector
summary: Federated Credentials auth implementation.
fullName: FederatedAppCredentials
remarks: ''
isDeprecated: false
type: class
constructors:
  - name: FederatedAppCredentials(string, string, string, string, string)
    uid: botframework-connector.FederatedAppCredentials.constructor
    package: botframework-connector
    summary: >-
      Initializes a new instance of the
      [FederatedAppCredentials](xref:botframework-connector.FederatedAppCredentials)
      class.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        new FederatedAppCredentials(appId: string, clientId: string,
        channelAuthTenant?: string, oAuthScope?: string, clientAudience?:
        string)
      parameters:
        - id: appId
          type: string
          description: App ID for the Application.
        - id: clientId
          type: string
          description: Client ID for the managed identity assigned to the bot.
        - id: channelAuthTenant
          type: string
          description: >-
            Tenant ID of the Azure AD tenant where the bot is created.
              - **Required** for SingleTenant app types.
              - **Optional** for MultiTenant app types. **Note**: '_botframework.com_' is the default tenant when no value is provided.

            More information:
            https://learn.microsoft.com/en-us/security/zero-trust/develop/identity-supported-account-types.
        - id: oAuthScope
          type: string
          description: '**Optional**. The scope for the token.'
        - id: clientAudience
          type: string
          description: >-
            **Optional**. The Audience used in the Client's Federated
            Credential. **Default** (_api://AzureADTokenExchange_).
