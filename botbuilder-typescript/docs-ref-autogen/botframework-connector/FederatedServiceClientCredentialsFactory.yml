### YamlMime:TSType
name: FederatedServiceClientCredentialsFactory
uid: botframework-connector.FederatedServiceClientCredentialsFactory
package: botframework-connector
summary: >-
  A Federated Credentials implementation of the
  [ServiceClientCredentialsFactory](xref:botframework-connector.ServiceClientCredentialsFactory)
  interface.
fullName: FederatedServiceClientCredentialsFactory
remarks: ''
isDeprecated: false
type: class
constructors:
  - name: FederatedServiceClientCredentialsFactory(string, string, string, string)
    uid: >-
      botframework-connector.FederatedServiceClientCredentialsFactory.constructor
    package: botframework-connector
    summary: >-
      Initializes a new instance of the
      [FederatedServiceClientCredentialsFactory](xref:botframework-connector.FederatedServiceClientCredentialsFactory)
      class.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        new FederatedServiceClientCredentialsFactory(appId: string, clientId:
        string, tenantId?: string, clientAudience?: string)
      parameters:
        - id: appId
          type: string
          description: App ID for the Application.
        - id: clientId
          type: string
          description: Client ID for the managed identity assigned to the bot.
        - id: tenantId
          type: string
          description: >-
            Tenant ID of the Azure AD tenant where the bot is created.
              - **Required** for SingleTenant app types.
              - **Optional** for MultiTenant app types. **Note**: '_botframework.com_' is the default tenant when no value is provided.

            More information:
            https://learn.microsoft.com/en-us/security/zero-trust/develop/identity-supported-account-types.
        - id: clientAudience
          type: string
          description: >-
            **Optional**. The Audience used in the Client's Federated
            Credential. **Default** (_api://AzureADTokenExchange_).
